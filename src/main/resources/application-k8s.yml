# k8s/EC2 배포 시 (SPRING_PROFILES_ACTIVE=k8s)
spring:
  config:
    activate:
      on-profile: k8s
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${auth-server.base-url}/oauth2/jwks

auth-server:
  base-url: ${AUTH_SERVER_BASE_URL:http://auth-server.note.svc.cluster.local:9000/authorization-api}
  public-url: ${AUTH_SERVER_PUBLIC_URL:https://auth.13.239.220.205.nip.io/authorization-api}
  internal-api-key: ${AUTH_INTERNAL_API_KEY:dev-internal-key}

app:
  mail:
    provider: gmail
  cors:
    allowed-origins:
      - https://app.13.239.220.205.nip.io
  auth:
    refresh-cookie:
      secure: true
      same-site: Lax
