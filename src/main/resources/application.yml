server:
  port: 8082
  tomcat:
    max-http-form-post-size: 20MB
    max-swallow-size: 20MB

auth-server:
  base-url: http://localhost:9000/authorization-api
  public-url: ${auth-server.base-url}
  internal-api-key: ${AUTH_INTERNAL_API_KEY:dev-internal-key}

oauth2:
  client:
    client-id: react-note
    client-secret: react-note-secret

app:
  mail:
    # 로컬 Mailcow IMAP. k8s 프로파일에서는 gmail 로 유지.
    provider: ${MAIL_PROVIDER:imap}
  cors:
    allowed-origins:
      - http://localhost:8080
      - http://127.0.0.1:8080
  auth:
    refresh-cookie:
      name: refresh_token
      secure: false
      same-site: Lax
      max-age-days: 30

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${auth-server.base-url}/oauth2/jwks
