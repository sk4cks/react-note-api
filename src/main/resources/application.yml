server:
  port: 8082
  tomcat:
    max-http-form-post-size: 20MB
    max-swallow-size: 20MB

auth-server:
  base-url: http://localhost:9000/authorization-api
  public-url: ${auth-server.base-url}
  internal-api-key: ${AUTH_INTERNAL_API_KEY:dev-internal-key}

oauth2:
  client:
    client-id: react-note
    client-secret: react-note-secret

app:
  ai:
    # OpenAI 호환. 키는 서버 env만. 브라우저에 두지 않음.
    base-url: ${AI_BASE_URL:https://api.openai.com}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    # 발송 성공 메일을 사용자별 jsonl로 남기는 디렉터리.
    train-dir: ${AI_TRAIN_DIR:${user.home}/mail-ai-data}
  mail:
    # 로컬·k8s 모두 Mailcow IMAP. Gmail로 바꾸려면 MAIL_PROVIDER=gmail.
    provider: ${MAIL_PROVIDER:imap}
  cors:
    allowed-origins:
      - http://localhost:8080
      - http://127.0.0.1:8080
  auth:
    refresh-cookie:
      name: refresh_token
      secure: false
      same-site: Lax
      max-age-days: 30

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${auth-server.base-url}/oauth2/jwks
